name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_ci_password
          POSTGRES_DB: orbit_hr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Restricted role, no BYPASSRLS — the app's runtime connection, so RLS
      # policies actually apply. Created by the enable_row_level_security
      # migration; only exists once `prisma migrate deploy` has run.
      DATABASE_URL: postgresql://orbit_app:orbit_app_dev_password@localhost:5432/orbit_hr_ci?schema=public
      # Privileged role (the Postgres service's own POSTGRES_USER) — only
      # Prisma CLI commands (migrate, generate) use this.
      DIRECT_DATABASE_URL: postgresql://orbit:orbit_ci_password@localhost:5432/orbit_hr_ci?schema=public
      JWT_SECRET: ci-secret-not-for-production
      JWT_EXPIRES_IN: 1d
      PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      # Pinned to match the npm version the lockfile was generated with.
      # Older npm resolves optional peer deps (magicast, typescript) into
      # the lock differently and `npm ci` fails a sync check that isn't real drift.
      - run: npm install -g npm@11.17.0
      - run: npm ci
      # .npmrc sets ignore-scripts=true (needed on a locked-down dev machine),
      # so npm never runs Prisma's postinstall generator. Do it explicitly.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
