name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_ci_password
          POSTGRES_DB: orbit_hr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orbit_app:orbit_app_dev_password@localhost:5432/orbit_hr_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://orbit:orbit_ci_password@localhost:5432/orbit_hr_ci?schema=public
      JWT_SECRET: ci-secret-not-for-production
      JWT_EXPIRES_IN: 1d
      PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          IMAGE_TAG="orbit-hr-api:${{ github.sha }}"
          echo "tags=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Building Docker image: $IMAGE_TAG"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          outputs: type=docker,dest=/tmp/image.tar
          tags: orbit-hr-api:latest,orbit-hr-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Deploy to staging
        run: bash scripts/deploy-staging.sh
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          POSTGRES_DB: orbit_hr
          DATABASE_URL: postgresql://orbit_app:orbit_app_dev_password@postgres:5432/orbit_hr?schema=public
          DIRECT_DATABASE_URL: postgresql://orbit:${{ secrets.STAGING_POSTGRES_PASSWORD }}@postgres:5432/orbit_hr?schema=public
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          WEB_ORIGIN: http://localhost:3000

      - name: Run smoke tests
        run: bash scripts/smoke-tests.sh
        continue-on-error: true
        timeout-minutes: 10

      - name: Report deployment
        if: always()
        run: |
          echo "Staging deployment completed"
          echo "API URL: http://localhost:3001/api"
          echo "Web URL: http://localhost:3000"

  request-approval:
    name: Request Production Approval
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Create deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const commit = context.payload.head_commit;
            const message = `🚀 Staging deployment successful for commit ${context.sha.substring(0, 7)}

            **Ready for production?** Manually trigger production deployment from Actions tab or push to a deployment branch.

            Commit: ${commit.message}
            Author: ${commit.author.name}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message,
            });

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Deploy to production
        run: bash scripts/deploy-production.sh
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
          POSTGRES_DB: orbit_hr
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          WEB_ORIGIN: ${{ secrets.PRODUCTION_WEB_ORIGIN }}
          DEPLOYMENT_SERVICE: ${{ secrets.DEPLOYMENT_SERVICE }}
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}

      - name: Create deployment record
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.deployment.id,
              state: 'success',
              description: 'Production deployment successful',
              environment_url: process.env.PRODUCTION_WEB_ORIGIN,
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Production Deployment Failed',
              body: `Production deployment failed for commit ${context.sha}

              Please review the logs and rollback if necessary.`,
              labels: ['deployment', 'production', 'critical'],
            });
