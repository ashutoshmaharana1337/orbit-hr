name: Test

on:
  pull_request:
  push:
    branches: ['*']

jobs:
  api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_ci_password
          POSTGRES_DB: orbit_hr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://orbit_app:orbit_app_dev_password@localhost:5432/orbit_hr_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://orbit:orbit_ci_password@localhost:5432/orbit_hr_ci?schema=public
      JWT_SECRET: ci-secret-not-for-production
      JWT_EXPIRES_IN: 1d
      PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: Test Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test-results:
    name: Test Results Summary
    needs: [api, web]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test status
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- API Tests: ${{ needs.api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Web Tests: ${{ needs.web.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: needs.api.result != 'success' || needs.web.result != 'success'
        run: exit 1
