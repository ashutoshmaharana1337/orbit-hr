version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres-staging
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_hr}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orbit_hr}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # NestJS API Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: hrms-api-staging
    restart: on-failure
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://orbit_app:orbit_app_dev_password@postgres:5432/orbit_hr?schema=public}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL:-postgresql://postgres:staging_password_123@postgres:5432/orbit_hr?schema=public}
      JWT_SECRET: ${JWT_SECRET:-staging_secret_key_change_in_production}
      JWT_EXPIRES_IN: 15m
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/logs:/app/logs
    networks:
      - staging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Next.js Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: production
    container_name: hrms-web-staging
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001/api}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - staging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    driver: local

networks:
  staging:
    driver: bridge
