# Fly.io config for the Orbit HR API.
# The app name is passed on the command line (see scripts/deploy-production.sh):
#   flyctl deploy --remote-only --config api/fly.toml --app "$FLY_APP_API"
#
# Required Fly secrets (flyctl secrets set ... --app <app>):
#   DATABASE_URL, DIRECT_DATABASE_URL, JWT_SECRET, REFRESH_TOKEN_SECRET,
#   WEB_ORIGIN (plus any optional mail / Sentry / log-shipper vars).

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "production"

[deploy]
  # Runs in a one-off machine before the new release is promoted; a failure
  # aborts the deploy. Uses DIRECT_DATABASE_URL (owner role) via prisma/schema.prisma.
  release_command = "npx prisma migrate deploy"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  TZ = "UTC"
  RUN_MIGRATIONS = "false"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
